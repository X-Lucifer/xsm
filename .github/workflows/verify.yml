name: Windows build and release

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  TARGET: x86_64-pc-windows-msvc
  CARGO_TERM_COLOR: always

jobs:
  verify:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          targets: ${{ env.TARGET }}
      - name: Read build metadata
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version = "([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          if (-not $version) { throw 'Cannot read package version' }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Cannot read build commit' }
          $epoch = git show -s --format=%ct HEAD
          if ($LASTEXITCODE) { throw 'Cannot read commit timestamp' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "SOURCE_DATE_EPOCH=$epoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --target ${{ env.TARGET }} -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked --all-targets --target ${{ env.TARGET }}
      - name: Test release publishing logic
        run: node --test scripts/tests/publish-release.test.cjs
      - name: Build Windows x64
        run: cargo build --locked --release --bins --examples --target ${{ env.TARGET }}
      - name: Package release files
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\package.ps1 -Target $env:TARGET
          $destination = Join-Path $PWD 'target\release-assets'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $files = @('xsm.exe', "xsm-$env:RELEASE_VERSION-windows-x64.zip")
          foreach ($file in $files) {
              Copy-Item -LiteralPath (Join-Path 'dist' $file) -Destination (Join-Path $destination $file)
          }
          $checksums = foreach ($file in $files) {
              '{0}  {1}' -f (Get-FileHash -LiteralPath (Join-Path $destination $file) -Algorithm SHA256).Hash.ToLowerInvariant(), $file
          }
          [IO.File]::WriteAllLines((Join-Path $destination 'SHA256SUMS.txt'), $checksums, [Text.UTF8Encoding]::new($false))
      - name: Upload verified build
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xsm-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: verify
    if: >-
      github.event_name == 'push' &&
      !github.event.deleted &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
        with:
          retries: 0
          script: |
            const publish = require('./scripts/publish-release.cjs');
            await publish({
              github, context, core,
              artifactDirectory: 'release-assets',
              version: process.env.RELEASE_VERSION,
              commit: process.env.RELEASE_COMMIT,
            });
